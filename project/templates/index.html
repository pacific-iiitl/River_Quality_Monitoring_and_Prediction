<!DOCTYPE html>
<html>
<head>
    <title>Real Time Water Quality Detection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #e9ecef; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #0078D7; }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            width: 200px;
            padding: 18px;
            text-align: center;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .label { font-size: 15px; color: #555; margin-bottom: 5px; }
        .value { font-size: 22px; font-weight: bold; color: #0078D7; }
        .timestamp { text-align: center; margin-top: 20px; color: #444; font-size: 15px; }
        .prediction {
            background: #0078D7;
            color: white;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h2>Real-Time Detection and Prediction of Water Contamination Level</h2>

    <div class="dashboard">
        <div class="card"><div class="label">Temp (°C) DS18B20</div><div class="value" id="tempds">--</div></div>
        <div class="card"><div class="label">Humidity (%)</div><div class="value" id="humidity">--</div></div>
        <div class="card"><div class="label">DHT11 Temp (°C)</div><div class="value" id="tempdht">--</div></div>
        <div class="card"><div class="label">pH</div><div class="value" id="ph">--</div></div>
        <div class="card"><div class="label">Turbidity</div><div class="value" id="turbidity">--</div></div>
        <div class="card"><div class="label">EC</div><div class="value" id="ec">--</div></div>
        <div class="card"><div class="label">DO</div><div class="value" id="do">--</div></div>
    </div>

    <div class="prediction" id="prediction">Awaiting Prediction...</div>
    <div class="timestamp" id="time">Timestamp: --</div>

    <script>
        var socket = io();
        socket.on('update', function(data) {
            document.getElementById("tempds").textContent = data.TempDS18B20;
            document.getElementById("humidity").textContent = data.Humidity;
            document.getElementById("tempdht").textContent = data.TempDHT11;
            document.getElementById("ph").textContent = data.pH;
            document.getElementById("turbidity").textContent = data.Turbidity;
            document.getElementById("ec").textContent = data.EC;
            document.getElementById("do").textContent = data.DO;
            document.getElementById("prediction").textContent = "Predicted Class: " + data.Prediction;
            document.getElementById("time").textContent = "Timestamp: " + data.timestamp;
        });
    </script>
</body>
</html>
